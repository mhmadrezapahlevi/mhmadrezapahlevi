name: Generate Snake

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
permissions:
  contents: write

steps:
  - name: Generate Snake
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: mhmadrezapahlevi
      outputs: |
        dist/github-snake.svg
        dist/github-snake-dark.svg?palette=github-dark

  - name: Deploy Snake
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
