name: Generate Contribution Calendar

on:
workflow_dispatch:
schedule:
- cron: "0 0 * * *"

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Generate calendar
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_USERNAME: mhmadrezapahlevi
    run: node scripts/generate-calendar.mjs

  - name: Publish calendar
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ github.token }}
      publish_branch: output
      publish_dir: ./dist
```
